[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-llm-research"
version = "0.1.0"
description = "Leakage-aware dual-LLM market forecasting research scaffold"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pydantic>=2.6", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
openai = ["openai>=1.40"]

[project.scripts]
spx-research = "spx_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

